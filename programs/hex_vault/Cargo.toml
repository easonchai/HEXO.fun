[package]
name = "hex_vault"
version = "0.1.0"
description = "HexVault no-loss lottery with zero-sum hex rounds"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "hex_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Localnet only: compiles in `test_fulfill`, which fabricates a fulfilled
# randomness account so the suite needs no ORAO deployment.
test-vrf = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token_2022"] }
solana-keccak-hasher = "2.2.1"
solana-sha256-hasher = "2.2.1"
