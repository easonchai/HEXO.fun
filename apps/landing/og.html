  /* Open Graph card for HEXO.fun, 1200×630. Brand kit palette and faces only;
     the board is drawn with the landing page's own computeGeo() so the card
     and the site can never disagree. Rendered to og.png by scripts/og.mjs. */
  :root {
    --navy: #0e1b2b;
    --navy-700: #132133;
    --ink: #e2e4e9;
    --ink-3: #838a93;
    --lime: #b6ff3b;
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 1200px;
    height: 630px;
    background: var(--navy);
    font-family: "Roboto Mono", monospace;
    overflow: hidden;
    position: relative;
  }
  .rules {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      90deg,
      rgba(226, 228, 233, 0.05) 0 1px,
      transparent 1px 76px

  }
  .board {
    position: absolute;
    top: 16px;
    right: -142px;
    width: 618px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 26%);
    mask-image: linear-gradient(90deg, transparent 0, #000 26%);
  }
  .in {
    position: relative;
    padding: 62px 70px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 15.5px;
  }
  .eyebrow {
    margin-top: auto;
    color: var(--ink-3);
    font-size: 17px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  /* Matches the site's h1: Syncopate 700, uppercase, .003em, 1.08. */
  h1 {
    font-family: "Syncopate", sans-serif;
    font-weight: 700;
    font-size: 60px;
    line-height: 1.08;
    letter-spacing: 0.003em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 18px 0 0;
    max-width: 700px;
  }
  h1 b {
    color: var(--lime);
    font-weight: 700;
  }
  .foot {
    margin-top: auto;
    color: var(--ink-2, #c2c6cd);
    font-size: 19px;
    letter-spacing: 0.04em;
  }
  .foot i {
    color: var(--ink-3);
    font-style: normal;
    padding: 0 14px;
  }

<script>
  const R = 265,
    CX = 310,
    CY = 300;

  /** The six textile symbols, ported from Textile.tsx (20x20 art). */
  const SYMBOLS = [
    `<path d="M3.5 3.5 L16.5 16.5 M16.5 3.5 L3.5 16.5" stroke="#B6FF3B" stroke-width="3.6" stroke-linecap="round" fill="none"/>`,
    `<circle cx="10" cy="10" r="8" fill="none" stroke="#B6FF3B" stroke-width="2.6"/><circle cx="10" cy="10" r="3.4" fill="#B6FF3B"/>`,
    `<rect x="2" y="2" width="16" height="16" rx="3.5" fill="none" stroke="#B6FF3B" stroke-width="2.6"/><rect x="7" y="7" width="6" height="6" rx="1.2" fill="#B6FF3B"/>`,
    `<rect x="2.5" y="7" width="15" height="6" rx="2.2" fill="#B6FF3B"/><rect x="7" y="2.5" width="6" height="15" rx="2.2" fill="#B6FF3B"/><circle cx="10" cy="10" r="2" fill="#0E1B2B"/>`,
    `<path fill="#B6FF3B" fill-rule="evenodd" d="M6.5 2 h7 a4.5 4.5 0 0 1 4.5 4.5 v7 a4.5 4.5 0 0 1 -4.5 4.5 h-7 a4.5 4.5 0 0 1 -4.5 -4.5 v-7 a4.5 4.5 0 0 1 4.5 -4.5 z M10 5.6 a4.4 4.4 0 1 0 0 8.8 a4.4 4.4 0 1 0 0 -8.8 z"/>`,
    `<polygon points="10,2.4 12.35,7 17.5,7.7 13.8,11.3 14.7,16.4 10,13.9 5.3,16.4 6.2,11.3 2.5,7.7 7.65,7" fill="#B6FF3B" stroke="#B6FF3B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`,
  ];

  const dotKey = (x, y) => `${Math.round(x)}_${Math.round(y)}`;

  /** computeGeo() from geo.ts. */
  function computeGeo() {
    const verts = [];
    for (let k = 0; k < 6; k++) {
      const a = ((-90 + 60 * k) * Math.PI) / 180;
      verts.push([CX + R * Math.cos(a), CY + R * Math.sin(a)]);
    }

    const tiles = [];
    let n = 1;
    for (let k = 0; k < 6; k++) {
      const [ax, ay] = verts[k];
      const [bx, by] = verts[(k + 1) % 6];
      const rot = (Math.atan2(by - ay, bx - ax) * 180) / Math.PI;
      for (let i = 0; i < 6; i++) {
        const t = 0.1481 + i * 0.1407;
        tiles.push({
          n: n++,
          x: +(ax + (bx - ax) * t).toFixed(1),
          y: +(ay + (by - ay) * t).toFixed(1),
          rot: +rot.toFixed(1),
        });
      }
    }

    const iR = R - 52;
    const iv = [];
    for (let k = 0; k < 6; k++) {
      const a = ((-90 + 60 * k) * Math.PI) / 180;
      iv.push([CX + iR * Math.cos(a), CY + iR * Math.sin(a)]);
    }
    const inside = (x, y) => {
      let c = false;
      for (let i = 0, j = 5; i < 6; j = i++) {
        const [xi, yi] = iv[i],
          [xj, yj] = iv[j];
        if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)
          c = !c;
      }
      return c;
    };

    const dots = [];
    let row = 0;
    for (let y = CY - 195; y <= CY + 195; y += 26, row++) {
      for (let x = CX - 210 + (row % 2 ? 14 : 0); x <= CX + 210; x += 28) {
        if (inside(x, y)) dots.push({ x, y, key: dotKey(x, y) });
      }
    }

    return {
      tiles,
      dots,
      hexPts: verts
        .map((v) => `${v[0].toFixed(1)},${v[1].toFixed(1)}`)
        .join(" "),
      cx: CX,
      cy: CY,
    };
  }

  const geo = computeGeo();
  // A scatter of "taken" tiles, fixed so the card renders identically every time.
  const LIT = new Set([3, 4, 15, 22, 27, 31, 33, 34, 36]);
  document.getElementById("board").innerHTML =
    `<polygon points="${geo.hexPts}" fill="none" stroke="rgba(226,228,233,.14)" stroke-width="1.2"/>` +
    geo.dots
      .map(
        (d) =>
          `<circle cx="${d.x}" cy="${d.y}" r="1.75" fill="rgba(182,255,59,.22)"/>`,
      )
      .join("") +
    geo.tiles
      .map((t) => {
        const on = LIT.has(t.n);
        return `<g transform="translate(${t.x} ${t.y})">
        <rect transform="rotate(${t.rot})" x="-17" y="-17" width="34" height="34" rx="2"
          fill="${on ? "rgba(182,255,59,.2)" : "#132133"}"
          stroke="${on ? "#B6FF3B" : "rgba(226,228,233,.13)"}" stroke-width="1.2"/>
        <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
          font-family="Roboto Mono, monospace" font-size="14" font-weight="600"
          fill="${on ? "#B6FF3B" : "#838a93"}">${t.n}</text>
      </g>`;
      })
      .join("");
</script>
